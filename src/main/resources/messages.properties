# Mensagens de conversao de tipo nos formularios: aparecem ao lado do campo quando o texto
# digitado nao vira numero, data ou id (por exemplo, "abc" no campo de latitude).
typeMismatch=Valor inválido.
typeMismatch.java.lang.Double=Informe um número, como -18.9113.
typeMismatch.java.lang.Integer=Informe um número inteiro.
typeMismatch.java.lang.Long=Escolha uma opção da lista.
typeMismatch.java.math.BigDecimal=Informe um número, com ponto antes das casas decimais, como 12.5.
typeMismatch.java.time.LocalDate=Informe uma data válida.
typeMismatch.java.time.LocalDateTime=Informe uma data e hora válidas.
