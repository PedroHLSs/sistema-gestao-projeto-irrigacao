<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Ajuste de saldo')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-4">
        <th:block th:replace="~{fragments/mensagens :: mensagens}"></th:block>

        <h1 class="page-title">Ajuste de saldo</h1>

        <div class="form-card">
            <div th:replace="~{estoque/resumoMaterial :: resumo(${material})}"></div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/estoque/materiais/{id}/ajuste(id=${material.id})}" th:object="${ajuste}"
                        method="post" novalidate>
                        <div class="mb-4">
                            <label for="novoSaldo" class="form-label">
                                Saldo contado (<span th:text="${material.unidade}">un</span>)
                            </label>
                            <input type="number" step="0.001" min="0" class="form-control form-control-lg"
                                th:field="*{novoSaldo}" th:errorclass="is-invalid" autofocus>
                            <div class="invalid-feedback" th:errors="*{novoSaldo}">Erro do saldo</div>
                            <div class="form-text">
                                O sistema grava a diferença para o saldo atual. O saldo não pode ficar abaixo do
                                reservado.
                            </div>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-scale-balanced me-2"></i>Ajustar saldo
                            </button>
                            <a th:href="@{/estoque/materiais}" class="btn btn-outline-secondary btn-lg">Voltar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
