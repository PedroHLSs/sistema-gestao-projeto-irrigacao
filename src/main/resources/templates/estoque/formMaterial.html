<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- Inclusão (material.id vazio) e edição do material. Não há campo de saldo: ele muda só pelas movimentações. -->
<head th:replace="~{fragments/head :: head(${material.id == null} ? 'Novo material' : 'Editar material')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-4" th:with="novo=${material.id == null}">
        <th:block th:replace="~{fragments/mensagens :: mensagens}"></th:block>

        <h1 class="page-title" th:text="${novo} ? 'Novo material' : 'Editar material'">Material</h1>

        <div class="card shadow-sm form-card">
            <div class="card-body p-4">
                <form th:action="${novo} ? @{/estoque/materiais} : @{/estoque/materiais/{id}(id=${material.id})}"
                    th:object="${material}" method="post" novalidate>
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-7">
                            <label for="codigo" class="form-label">Código</label>
                            <input type="text" class="form-control" th:field="*{codigo}" th:errorclass="is-invalid"
                                maxlength="30" th:autofocus="${novo}" autocomplete="off" spellcheck="false"
                                placeholder="TB-PVC-050">
                            <div class="invalid-feedback" th:errors="*{codigo}">Erro do código</div>
                        </div>
                        <div class="col-12 col-sm-5">
                            <label for="unidade" class="form-label">Unidade</label>
                            <input type="text" class="form-control" th:field="*{unidade}" th:errorclass="is-invalid"
                                maxlength="10" placeholder="un, m, barra">
                            <div class="invalid-feedback" th:errors="*{unidade}">Erro da unidade</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <input type="text" class="form-control" th:field="*{descricao}" th:errorclass="is-invalid"
                            maxlength="150">
                        <div class="invalid-feedback" th:errors="*{descricao}">Erro da descrição</div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12 col-sm-6">
                            <label for="precoVenda" class="form-label">Preço de venda (R$)</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{precoVenda}"
                                th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{precoVenda}">Erro do preço</div>
                            <div class="form-text">Entra no orçamento.</div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="custoUnitario" class="form-label">Custo unitário (R$)</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{custoUnitario}"
                                th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{custoUnitario}">Erro do custo</div>
                            <div class="form-text">Entra no custo real do projeto.</div>
                        </div>
                    </div>

                    <p class="text-muted small" th:if="${novo}">
                        O material começa com saldo zero. O saldo entra pela entrada de compra.
                    </p>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-floppy-disk me-2"></i><span th:text="${novo} ? 'Cadastrar material' : 'Salvar alterações'">Salvar</span>
                        </button>
                        <a th:href="@{/estoque/materiais}" class="btn btn-outline-secondary">Voltar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
