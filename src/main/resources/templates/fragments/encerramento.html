<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- Limitação conhecida do orçado x realizado (RF22), repetida em toda tela que mostra o realizado -->
    <p th:fragment="limitacaoCusto" class="alert alert-info small">
        <i class="fas fa-circle-info me-1"></i>
        O sistema não guarda o custo do material na data do consumo. O custo realizado usa o custo unitário
        <strong>atual</strong> do cadastro; se ele mudou depois da obra, o valor muda aqui também.
    </p>

    <!-- Indicador do painel inicial: o número em destaque, que leva à tela onde o trabalho é feito -->
    <a th:fragment="indicador(valor, rotulo, destino, icone)" th:href="${destino}"
        class="card shadow-sm h-100 text-decoration-none painel-indicador">
        <span class="card-body d-flex align-items-center gap-3">
            <i class="fas fa-fw fs-3 painel-icone" th:classappend="${icone}" aria-hidden="true"></i>
            <span>
                <span class="d-block painel-numero" th:text="${valor}">0</span>
                <span class="d-block text-body" th:text="${rotulo}">Indicador</span>
            </span>
        </span>
    </a>
</body>

</html>
