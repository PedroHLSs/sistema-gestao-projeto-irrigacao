<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Projetos em Finalizando execução esperando a liberação do faturamento (RF20) -->
<head th:replace="~{fragments/head :: head('Liberação do faturamento')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-4">
        <th:block th:replace="~{fragments/mensagens :: mensagens}"></th:block>

        <h1 class="page-title">Liberação do faturamento</h1>

        <p th:if="${#lists.isEmpty(projetos)}" class="alert alert-success">Nenhum projeto esperando a liberação.</p>

        <section th:each="item : ${projetos}" class="card shadow-sm mb-3">
            <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <a th:href="@{/projetos/{id}(id=${item.projeto.id})}" class="fw-semibold"
                        th:text="${item.projeto.codigo}">PRJ-2026-0001</a>
                    <div th:text="${item.projeto.propriedade.produtor.nome}">Produtor</div>
                    <div class="small text-muted"
                        th:text="|${item.projeto.propriedade.nome}, ${item.projeto.propriedade.municipio}|">Fazenda, Município</div>
                    <div th:if="${item.bloqueado}" class="small text-danger mt-1">
                        <i class="fas fa-lock me-1"></i><span th:text="${item.motivoBloqueio}">Motivo do bloqueio</span>
                    </div>
                </div>
                <div sec:authorize="hasAnyAuthority('FINANCEIRO', 'ADMINISTRADOR')">
                    <button th:if="${item.bloqueado}" type="button" class="btn btn-primary" disabled>
                        <i class="fas fa-lock me-2"></i>Liberar faturamento
                    </button>
                    <a th:unless="${item.bloqueado}" th:href="@{/financeiro/liberacoes/{id}(id=${item.projeto.id})}"
                        class="btn btn-primary">
                        <i class="fas fa-file-invoice-dollar me-2"></i>Liberar faturamento
                    </a>
                </div>
            </div>
        </section>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
