<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- Inclusão (propriedade.id vazio) e edição da propriedade de um produtor -->
<head th:replace="~{fragments/head :: head(${propriedade.id == null} ? 'Nova propriedade' : 'Editar propriedade')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-4" th:with="nova=${propriedade.id == null}">
        <th:block th:replace="~{fragments/mensagens :: mensagens}"></th:block>

        <h1 class="page-title" th:text="${nova} ? 'Nova propriedade' : 'Editar propriedade'">Propriedade</h1>
        <p class="text-muted">
            Produtor: <strong th:text="${produtor.nome}">Nome do produtor</strong>
        </p>

        <div class="card shadow-sm form-card">
            <div class="card-body p-4">
                <form th:action="${nova}
                        ? @{/comercial/produtores/{produtorId}/propriedades(produtorId=${produtor.id})}
                        : @{/comercial/produtores/{produtorId}/propriedades/{id}(produtorId=${produtor.id},id=${propriedade.id})}"
                    th:object="${propriedade}" method="post" novalidate>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da propriedade</label>
                        <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                            maxlength="120" th:autofocus="${nova}" placeholder="Fazenda Boa Vista">
                        <div class="invalid-feedback" th:errors="*{nome}">Erro do nome</div>
                    </div>

                    <div class="mb-3">
                        <label for="municipio" class="form-label">Município</label>
                        <input type="text" class="form-control" th:field="*{municipio}" th:errorclass="is-invalid"
                            maxlength="80">
                        <div class="invalid-feedback" th:errors="*{municipio}">Erro do município</div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="latitude" class="form-label">Latitude <span class="text-muted">(opcional)</span></label>
                            <input type="number" step="any" class="form-control" th:field="*{latitude}"
                                th:errorclass="is-invalid" placeholder="-18.9113">
                            <div class="invalid-feedback" th:errors="*{latitude}">Erro da latitude</div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="longitude" class="form-label">Longitude <span class="text-muted">(opcional)</span></label>
                            <input type="number" step="any" class="form-control" th:field="*{longitude}"
                                th:errorclass="is-invalid" placeholder="-48.2622">
                            <div class="invalid-feedback" th:errors="*{longitude}">Erro da longitude</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="areaTotalHa" class="form-label">Área total em hectares <span class="text-muted">(opcional)</span></label>
                        <input type="number" step="any" min="0" class="form-control" th:field="*{areaTotalHa}"
                            th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{areaTotalHa}">Erro da área</div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-floppy-disk me-2"></i><span th:text="${nova} ? 'Cadastrar propriedade' : 'Salvar alterações'">Salvar</span>
                        </button>
                        <a th:href="@{/comercial/produtores/{id}/editar(id=${produtor.id})}"
                            class="btn btn-outline-secondary">Voltar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
