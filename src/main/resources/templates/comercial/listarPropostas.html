<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!--
    Propostas (RF09 a RF11), em andamento por padrão e filtradas por situação. O controller vence as que
    passaram da validade antes de listar.
-->
<head th:replace="~{fragments/head :: head('Propostas')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-4">
        <th:block th:replace="~{fragments/mensagens :: mensagens}"></th:block>

        <h1 class="page-title">Propostas</h1>

        <form th:action="@{/comercial/propostas}" method="get" class="row g-2 align-items-end mb-3">
            <div class="col-12 col-sm-auto">
                <label for="filtro" class="form-label">Situação</label>
                <select id="filtro" name="filtro" class="form-select">
                    <option value="" th:selected="${filtro == ''}">Em andamento</option>
                    <option th:each="s : ${situacoes}" th:value="${s.name()}" th:text="${s.rotulo}"
                        th:selected="${filtro == s.name()}">Aprovada</option>
                    <option value="TODAS" th:selected="${filtro == 'TODAS'}">Todas</option>
                </select>
            </div>
            <div class="col-12 col-sm-auto">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="fas fa-filter me-2"></i>Filtrar
                </button>
            </div>
            <div class="col-12 col-sm text-sm-end form-text"
                th:text="${filtro == ''} ? 'Em andamento: em elaboração, aguardando a diretoria e enviadas.' : |${#lists.size(propostas)} proposta(s)|">
                Em andamento: em elaboração, aguardando a diretoria e enviadas.</div>
        </form>

        <div class="table-responsive bg-white border rounded shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col">Proposta</th>
                        <th scope="col">Produtor</th>
                        <th scope="col">Responsável</th>
                        <th scope="col">Situação</th>
                        <th scope="col" class="text-end">Valor total</th>
                        <th scope="col">Validade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${propostas}"
                        th:with="vencendo=${p.situacao.name() == 'ENVIADA' and !p.dataValidade.isAfter(limiteAlerta)}">
                        <td class="text-nowrap">
                            <a th:href="@{/comercial/propostas/{id}(id=${p.id})}" class="fw-semibold"
                                th:text="|${p.projeto.codigo} nº ${p.numero}|">PRJ-2026-0001 nº 1</a>
                        </td>
                        <td th:text="${p.projeto.propriedade.produtor.nome}">Produtor</td>
                        <td th:text="${p.projeto.responsavel.nome}">Vendedor</td>
                        <td><span th:replace="~{fragments/situacao :: badgeProposta(${p.situacao})}"></span></td>
                        <td class="text-end text-nowrap"
                            th:text="|R$ ${#numbers.formatDecimal(p.valorTotal, 1, 'POINT', 2, 'COMMA')}|">R$ 2.363,60</td>
                        <td class="text-nowrap">
                            <span th:if="${p.dataValidade != null}" th:text="|até ${#temporals.format(p.dataValidade, 'dd/MM/yyyy')}|">até 01/12/2026</span>
                            <span th:if="${p.dataValidade == null}" class="text-muted">ainda não enviada</span>
                            <span th:if="${vencendo}" class="badge text-bg-warning ms-1">vence em breve</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(propostas)}">
                        <td colspan="6" class="text-center text-muted py-4"
                            th:text="${filtro == ''} ? 'Nenhuma proposta em andamento.' : 'Nenhuma proposta nesta situação.'">
                            Nenhuma proposta em andamento.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
