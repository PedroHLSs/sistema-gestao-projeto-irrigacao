<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Acesso negado')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-5 text-center">
        <p class="error-status">403</p>
        <h1 class="h3">Acesso negado</h1>
        <p class="lead text-muted">
            O seu perfil não tem permissão para acessar esta página.
            <span th:if="${usuarioAtual != null}">
                Você entrou como <strong th:text="${usuarioAtual.perfil}">Perfil</strong>.
            </span>
        </p>

        <a th:href="@{/}" class="btn btn-primary btn-lg mt-3">
            <i class="fas fa-house me-2"></i>Voltar para o início
        </a>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
