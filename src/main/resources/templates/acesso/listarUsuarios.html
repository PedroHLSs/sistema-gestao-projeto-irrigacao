<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Usuários')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-4">
        <th:block th:replace="~{fragments/mensagens :: mensagens}"></th:block>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="page-title mb-0 flex-grow-1">Usuários</h1>
            <a th:href="@{/admin/usuarios/novo}" class="btn btn-primary">
                <i class="fas fa-user-plus me-2"></i>Novo usuário
            </a>
        </div>

        <div class="table-responsive bg-white border rounded shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Login</th>
                        <th scope="col">Perfil</th>
                        <th scope="col">Situação</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}" th:with="proprio=${usuarioAtual != null and usuarioAtual.id == u.id}"
                        th:classappend="${!u.ativo} ? 'text-muted'">
                        <td>
                            <span th:text="${u.nome}">Nome</span>
                            <span th:if="${proprio}" class="badge text-bg-light border ms-1">você</span>
                        </td>
                        <td th:text="${u.login}">login</td>
                        <td th:text="${u.perfil.rotulo}">Perfil</td>
                        <td>
                            <span th:if="${u.ativo}" class="badge text-bg-success">Ativo</span>
                            <span th:unless="${u.ativo}" class="badge text-bg-secondary">Inativo</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}"
                                class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-pen me-1"></i>Editar
                            </a>

                            <!-- Ativar e desativar alteram dado: POST com CSRF, nunca link -->
                            <form th:if="${u.ativo and !proprio}" th:action="@{/admin/usuarios/{id}/desativar(id=${u.id})}"
                                method="post" class="d-inline"
                                th:attr="data-confirmar=|Desativar ${u.nome}? Esse login não vai mais conseguir entrar no sistema.|">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fas fa-user-slash me-1"></i>Desativar
                                </button>
                            </form>
                            <form th:unless="${u.ativo}" th:action="@{/admin/usuarios/{id}/ativar(id=${u.id})}"
                                method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    <i class="fas fa-user-check me-1"></i>Ativar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum usuário cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
