<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Entrar')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-5">
        <div class="card shadow-sm mx-auto login-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-droplet login-icone"></i>
                    <h1 class="h4 mt-2 mb-1">Entrar</h1>
                    <p class="text-muted mb-0">Sistema de Gestão de Projetos de Irrigação</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    <i class="fas fa-circle-exclamation me-2"></i>Login ou senha inválidos.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    <i class="fas fa-circle-check me-2"></i>Você saiu do sistema.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Login</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username"
                            autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                            autocomplete="current-password" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-right-to-bracket me-2"></i>Entrar
                        </button>
                    </div>
                </form>

                <p class="small text-muted text-center mt-4 mb-0">
                    Ainda não tem acesso ou esqueceu a senha? Fale com o administrador do sistema.
                </p>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
