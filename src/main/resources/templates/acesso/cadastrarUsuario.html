<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Novo usuário')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-4">
        <th:block th:replace="~{fragments/mensagens :: mensagens}"></th:block>

        <h1 class="page-title">Novo usuário</h1>

        <div class="card shadow-sm form-card">
            <div class="card-body p-4">
                <form th:action="@{/admin/usuarios}" th:object="${usuario}" method="post" novalidate>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                            maxlength="120" autofocus>
                        <div class="invalid-feedback" th:errors="*{nome}">Erro do nome</div>
                    </div>

                    <div class="mb-3">
                        <label for="login" class="form-label">Login</label>
                        <input type="text" class="form-control" th:field="*{login}" th:errorclass="is-invalid"
                            maxlength="60" autocomplete="off" autocapitalize="none" spellcheck="false">
                        <div class="invalid-feedback" th:errors="*{login}">Erro do login</div>
                        <div class="form-text">É o que a pessoa digita para entrar. Exemplo: maria.souza</div>
                    </div>

                    <div class="mb-3">
                        <label for="perfil" class="form-label">Perfil</label>
                        <select class="form-select" th:field="*{perfil}" th:errorclass="is-invalid">
                            <option value="">Selecione</option>
                            <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.rotulo}">Perfil</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{perfil}">Erro do perfil</div>
                        <div class="form-text">O perfil define o menu e as áreas que o usuário acessa.</div>
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label">Senha inicial</label>
                        <input type="password" class="form-control" th:field="*{senha}" th:errorclass="is-invalid"
                            autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{senha}">Erro da senha</div>
                        <div class="form-text">No mínimo 8 caracteres.</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-floppy-disk me-2"></i>Criar usuário
                        </button>
                        <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
