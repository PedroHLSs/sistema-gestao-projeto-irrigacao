<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Erro')}">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container py-5 text-center">
        <p class="error-status" th:text="${status}">500</p>

        <th:block th:switch="${status}">
            <h1 class="h3" th:case="404">Página não encontrada</h1>
            <h1 class="h3" th:case="403">Acesso negado</h1>
            <h1 class="h3" th:case="*">Algo deu errado</h1>
        </th:block>

        <p class="lead text-muted" th:switch="${status}">
            <span th:case="404">O endereço que você tentou abrir não existe ou foi movido.</span>
            <span th:case="403">Você não tem permissão para acessar esta página.</span>
            <span th:case="*">Não foi possível concluir a operação. Tente de novo em alguns instantes.</span>
        </p>

        <a th:href="@{/}" class="btn btn-primary btn-lg mt-3">
            <i class="fas fa-house me-2"></i>Voltar para o início
        </a>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>

</html>
