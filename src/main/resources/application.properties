spring.application.name=irrigacao

# Banco de dados. Os valores depois dos dois-pontos sao apenas o padrao do
# docker-compose.yml de desenvolvimento. Em qualquer outro ambiente, defina
# DB_URL, DB_USER e DB_PASSWORD como variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/irrigacao}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Tabelas criadas pelo Hibernate (sem schema.sql, data.sql, Flyway ou Liquibase).
# spring.jpa.open-in-view fica no padrao do Spring Boot.
spring.jpa.hibernate.ddl-auto=update

# Upload de fotos e assinaturas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Parametros de negocio
irrigacao.proposta.validade-dias=15
irrigacao.proposta.dias-alerta=3
# Desconto maximo, em %, que o vendedor da sem aprovacao da diretoria (RF10)
irrigacao.alcada-desconto.vendedor=5
# Mao de obra, em R$ por hora: preco-hora entra no valor da proposta (RF09) e
# custo-hora entra no custo orcado e no custo realizado (RF22)
irrigacao.mao-obra.preco-hora=85.00
irrigacao.mao-obra.custo-hora=45.00
# Pasta onde ficam as fotos do levantamento e da medicao (fora do Git)
irrigacao.upload.dir=./uploads

# Senha do usuario "admin", que a carga inicial cria quando ainda nao existe nenhum
# administrador (RF23). Vem da variavel de ambiente IRRIGACAO_ADMIN_SENHA. Sem ela o
# usuario nao e criado: so o perfil dev tem senha padrao (application-dev.properties).
irrigacao.admin.senha=${IRRIGACAO_ADMIN_SENHA:}
