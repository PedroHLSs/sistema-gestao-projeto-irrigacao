spring.application.name=irrigacao

# Banco de dados. Os valores depois dos dois-pontos sao apenas o padrao do
# docker-compose.yml de desenvolvimento. Em qualquer outro ambiente, defina
# DB_URL, DB_USER e DB_PASSWORD como variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/irrigacao}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Tabelas criadas pelo Hibernate (sem schema.sql, data.sql, Flyway ou Liquibase).
# spring.jpa.open-in-view fica no padrao do Spring Boot.
spring.jpa.hibernate.ddl-auto=update

# Upload de fotos e assinaturas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Parametros de negocio
irrigacao.proposta.validade-dias=15
irrigacao.proposta.dias-alerta=3
