# LOCK_TIMEOUT de 10 s: no teste de concorrência do estoque, as threads esperam a vez na linha do material
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Fotos dos testes ficam dentro de target/, que o mvn clean apaga
irrigacao.upload.dir=target/test-uploads

# Sem agendamento nos testes: eles chamam o VerificadorDePropostas direto, com o relogio que controlam
irrigacao.proposta.verificacao-cron=-
