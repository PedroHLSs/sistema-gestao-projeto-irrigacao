# PostgreSQL para desenvolvimento local (para quem não tem o Postgres instalado).
# Subir: docker compose up -d      Parar: docker compose down
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: irrigacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - irrigacao_pgdata:/var/lib/postgresql/data

volumes:
  irrigacao_pgdata:
